name: Windows Build + Installer

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022name: Windows Build + Installer

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Qt6 ──────────────────────────────────────────────────────────
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      # ── 3. MSVC environment ─────────────────────────────────────────────
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ── 4. Setup vcpkg ───────────────────────────────────────────────────
      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        shell: cmd

      # ── 5. Instalacja zależności przez vcpkg ────────────────────────────
      - name: vcpkg install dependencies
        run: |
          C:\vcpkg\vcpkg.exe install exiv2:x64-windows libraw:x64-windows
        shell: cmd

      # ── 6. CMake + Ninja ─────────────────────────────────────────────────
      - name: Setup Ninja
        uses: lukka/get-cmake@latest

      # ── 7. Konfiguracja CMake ────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=x64-windows ^
            -DCMAKE_INSTALL_PREFIX=deploy
        shell: cmd

      # ── 8. Kompilacja ────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release --parallel
        shell: cmd

      # ── 9. Install + windeployqt ─────────────────────────────────────────
      - name: Deploy
        run: |
          cmake --install build --prefix deploy
          windeployqt.exe --release --no-translations deploy\bin\lapes-eye.exe
        shell: cmd

      # ── 10. Kopiuj DLL-e z vcpkg ─────────────────────────────────────────
      - name: Copy vcpkg DLLs
        run: |
          xcopy /Y /Q C:\vcpkg\installed\x64-windows\bin\*.dll deploy\bin\
        shell: cmd

      # ── 11. NSIS Installer ───────────────────────────────────────────────
      - name: Install NSIS
        run: choco install nsis -y
        shell: cmd

      - name: Build installer
        run: |
          makensis /V2 ^
            /DAPP_VERSION="0.5.0" ^
            /DDEPLOY_DIR="%CD%\deploy" ^
            installer\lapes-eye-installer.nsi
        shell: cmd

      # ── 12. Upload artifacts ─────────────────────────────────────────────
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lapes-eye-windows-installer
          path: installer\lapes-eye-setup-*.exe

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: lapes-eye-windows-portable
          path: deploy\


    env:
      VCPKG_ROOT: C:\vcpkg
      # Zmień na aktualny hash commita vcpkg (stabilny baseline)
      VCPKG_COMMIT: 2024.12.16

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. vcpkg ────────────────────────────────────────────────────────
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\buildtrees
            ~/.cache/vcpkg
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ env.VCPKG_COMMIT }}-

      - name: Setup vcpkg
        run: |
          if (!(Test-Path "C:\vcpkg\.git")) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          }
          cd C:\vcpkg
          git fetch --all
          .\bootstrap-vcpkg.bat -disableMetrics

      # ── 3. Qt6 ──────────────────────────────────────────────────────────
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: ''
          cache: true

      # ── 4. CMake + Ninja ─────────────────────────────────────────────────
      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest

      # ── 5. MSVC environment ─────────────────────────────────────────────
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ── 6. Instalacja zależności przez vcpkg ────────────────────────────
      - name: vcpkg install dependencies
        run: |
          C:\vcpkg\vcpkg.exe install exiv2:x64-windows libraw:x64-windows --recurse
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows

      # ── 7. Konfiguracja CMake ────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_INSTALL_PREFIX=install
        env:
          Qt6_DIR: ${{ env.Qt6_DIR }}

      # ── 8. Kompilacja ────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release --parallel

      # ── 9. Deploy Qt DLL-i (windeployqt) ────────────────────────────────
      - name: Deploy Qt
        run: |
          cmake --install build --prefix deploy
          windeployqt.exe `
            --release `
            --no-translations `
            --no-system-d3d-compiler `
            deploy\bin\lapes-eye.exe

      # ── 10. Kopiuj vcpkg DLL-e obok EXE ─────────────────────────────────
      - name: Copy vcpkg runtime DLLs
        run: |
          $src = "C:\vcpkg\installed\x64-windows\bin"
          $dst = "deploy\bin"
          $dlls = @(
            "exiv2.dll","exiv2-xmp.dll",
            "libraw.dll",
            "zlib1.dll","brotlidec.dll","brotlicommon.dll",
            "inih.dll","expat.dll"
          )
          foreach ($dll in $dlls) {
            $f = Join-Path $src $dll
            if (Test-Path $f) {
              Copy-Item $f $dst
              Write-Host "Copied $dll"
            } else {
              Write-Warning "Not found: $dll"
            }
          }
          # Kopiuj całe *.dll na wszelki wypadek
          Get-ChildItem "$src\*.dll" | ForEach-Object {
            $dest = Join-Path $dst $_.Name
            if (!(Test-Path $dest)) { Copy-Item $_.FullName $dest }
          }

      # ── 11. NSIS Installer ───────────────────────────────────────────────
      - name: Install NSIS
        run: choco install nsis -y

      - name: Build NSIS installer
        run: |
          makensis /V2 `
            /DAPP_VERSION="${{ github.ref_name }}" `
            /DDEPLOY_DIR="${{ github.workspace }}\deploy" `
            installer\lapes-eye-installer.nsi

      # ── 12. Upload artifacts ─────────────────────────────────────────────
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lapes-eye-windows-installer
          path: installer\lapes-eye-setup-*.exe

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lapes-eye-windows-portable
          path: deploy\

      # ── 13. Release (tylko przy tagu v*) ─────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer\lapes-eye-setup-*.exe
          generate_release_notes: true
