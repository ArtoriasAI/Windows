name: Windows Build + Installer

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Qt6 ──────────────────────────────────────────────────────────
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      # ── 3. MSVC environment ─────────────────────────────────────────────
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ── 4. Setup vcpkg ───────────────────────────────────────────────────
      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        shell: cmd

      # ── 5. Instalacja zależności przez vcpkg ────────────────────────────
      - name: vcpkg install dependencies
        run: |
          C:\vcpkg\vcpkg.exe install --triplet x64-windows --vcpkg-root C:\vcpkg
        shell: cmd

      # ── 6. CMake + Ninja ─────────────────────────────────────────────────
      - name: Setup Ninja
        uses: lukka/get-cmake@latest

      # ── 7. Konfiguracja CMake ────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=x64-windows ^
            -DCMAKE_INSTALL_PREFIX=deploy
        shell: cmd

      # ── 8. Kompilacja ────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release --parallel
        shell: cmd

      # ── 9. Install + windeployqt ─────────────────────────────────────────
      - name: Deploy
        run: |
          cmake --install build --prefix deploy
          windeployqt.exe --release --no-translations deploy\bin\lapes-eye.exe
        shell: cmd

      # ── 10. Kopiuj DLL-e z vcpkg ─────────────────────────────────────────
      - name: Copy vcpkg DLLs
        run: |
          xcopy /Y /Q build\vcpkg_installed\x64-windows\bin\*.dll deploy\bin\
        shell: cmd

      # ── 11. NSIS Installer ───────────────────────────────────────────────
      - name: Install NSIS
        run: choco install nsis -y
        shell: cmd

      - name: Build installer
        run: |
          makensis /V2 ^
            /DAPP_VERSION="0.5.95" ^
            /DDEPLOY_DIR="%CD%\deploy" ^
            installer\lapes-eye-installer.nsi
        shell: cmd

      # ── 12. Upload artifacts ─────────────────────────────────────────────
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lapes-eye-windows-installer
          path: installer\lapes-eye-setup-*.exe

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: lapes-eye-windows-portable
          path: deploy\
